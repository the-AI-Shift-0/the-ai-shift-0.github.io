<!DOCTYPE html>
<html lang="en">
<head><script>if(localStorage.getItem("ais_auth")!=="apurv"){try{sessionStorage.setItem("ais_next",location.pathname+location.search+location.hash)}catch(e){}location.replace("/");}</script>
<!--
  The drill-down: this room read against the transcripts of the presenter's
  past appearances. Two plain halves - what this audience does NOT respond to,
  and what it typically DOES.

  ═══════════════════════════════════════════════════════════════════
  EVERY STATISTIC ON THIS PAGE WAS DELETED. Owner's decision, 2026-08-19:
  "I'll remove the numbers completely, the 41 appearances, nine comparable
  rooms, all of that." Gone: the four stat tiles (41 / 9 / 5 / 2), the
  "9 of your 41" subheading, every "Used in N of 9 ... died in all N" meta
  line, the "+ 2 more hooks" note, and the "41 past appearances" loading
  sub-line. DO NOT REINSTATE ANY OF THEM - not here and not on l4.html,
  whose right rail carried copies.
  In their place, at the top where the tiles were, a plain framing line:
  the transcripts of your past appearances, then the insights.
  ═══════════════════════════════════════════════════════════════════
  ALSO REMOVED 2026-08-19: the quoted review / comment blocks and the
  source labels that referenced them. The page states the insight; it no
  longer quotes anyone to prove it.
  ═══════════════════════════════════════════════════════════════════
  "Best rooms" is dead wording everywhere - the presenter could not parse
  it on camera. It is "your past appearances" on every page and in every
  title, button and back link.
  ═══════════════════════════════════════════════════════════════════
  See index.html for the recording note. NOTHING ON THIS PAGE IS BLURRED -
  the show name renders SHARP, per the owner's decision of 2026-08-11.
  SIMULATED: every conclusion below. Each is written only from confirmed
  material about this show's audience.
-->
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Message Research - Compared to Your Past Appearances</title>

    <!-- ══════════════════════════════════════════════════════════════
         SHOW DATA - every show-specific string on this page lives in this
         one object. Swap here if the show changes.
         VERIFIED 2026-08-11: `name`.
         SIMULATED: every bullet below. Each is written only from confirmed
         material about this show's audience, so nothing on screen asserts
         an insight the confirmed material does not carry.
         NO COUNTS, NO STATISTICS, NO QUOTES AND NO PER-PERSON ATTRIBUTION
         RENDER ANYWHERE ON THIS PAGE. `name` renders SHARP.
         ══════════════════════════════════════════════════════════════ -->
    <script>
    var PROVISIONAL = {
        name: "The Amy Porterfield Show",
        roomDescriptor: "online business owners and course creators, building it themselves and scanning for the pitch",

        /* The framing line that replaced the four stat tiles. It sits where
           they sat, at the top, and it is the whole explanation of where
           these insights come from. */
        framingLabel: "From your own transcripts",
        framingLine: "Read every transcript from your past appearances, then read this room. These are the insights for this opportunity.",

        /* TWO PLAIN HALVES. Bullets, never prose - each is a short lead in
           bold and at most one short clause after it. If a bullet needs a
           second sentence it is too long for this page. */
        notRespond: [
            { lead: "A big money number up front",   tail: "this room measures itself in first steps, not millions." },
            { lead: "The technology",                tail: "nothing it writes about itself is about a machine." },
            { lead: "Credentials before the story",  tail: "it is not asking whether you are good enough." },
            { lead: "Free content that turns into a pitch", tail: "it says so, in public, in those words." }
        ],
        respond: [
            { lead: "The years you got it wrong",    tail: "said first, before anything that worked." },
            { lead: "Time saved, not revenue earned", tail: "seven hours down to forty-five minutes." },
            { lead: "The trap you built yourself",   tail: "more clients, more fixed cost, more appearances." },
            { lead: "The method given away in full", tail: "before they have to ask what the catch is." },
            { lead: "The life the business was meant to buy", tail: "kids, parents, a Saturday you got back." }
        ]
    };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f7ff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #f8f7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner-lg {
            width: 28px; height: 28px;
            border: 3px solid #e9d5ff;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg { font-size: 14px; color: #6b7280; font-weight: 500; }
        .loading-sub { font-size: 12px; color: #9ca3af; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 40px;
            background: #ffffff; border-bottom: 1px solid #ddd6fe; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-dot { width: 10px; height: 10px; border-radius: 50%; background: #7c3aed; }
        .header-logo { font-weight: 700; font-size: 15px; color: #111827; letter-spacing: -0.4px; }
        .header-back { font-size: 12px; color: #7c3aed; cursor: pointer; font-weight: 600; }
        .header-back:hover { color: #6d28d9; }

        /* Tightened 2026-08-19 so the whole page clears the fold on a
             1280x800 MacBook Air - it overran by 87px before. Measured at
             1400x1000 and 1280x800: scrollHeight == clientHeight at both. */
        .container {
            flex: 1; padding: 30px 40px 28px;
            max-width: 1000px; margin: 0 auto; width: 100%;
        }

        .page-title { font-size: 26px; font-weight: 700; color: #111827; margin-bottom: 8px; letter-spacing: -0.5px; }
        .page-sub { font-size: 14px; color: #6b7280; margin-bottom: 22px; line-height: 1.6; }
        .page-sub strong { color: #7c3aed; }

        /* The framing strip stands exactly where the four stat tiles stood.
           Owner's decision, 2026-08-19 - every number on this page is gone
           and this line is what replaced them. Do not put a figure in it. */
        .framing {
            background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 12px;
            padding: 16px 24px; margin-bottom: 22px;
        }
        .framing-label {
            font-size: 10.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.08em; color: #7c3aed; margin-bottom: 7px;
        }
        .framing-line { font-size: 14.5px; color: #374151; line-height: 1.6; }

        /* TWO PLAIN HALVES, side by side. Replaced the old "died in rooms
           like this one" / "landed in rooms like this one" panels, whose
           wording the presenter could not read off the screen. */
        .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .half {
            border-radius: 14px; padding: 22px 24px;
            background: #ffffff; border: 1.5px solid #e9d5ff;
        }
        .half.no { background: #fff1f2; border-color: #fecdd3; }
        .half-title {
            font-size: 12.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.07em; color: #16a34a; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .half.no .half-title { color: #dc2626; }
        .bullet {
            font-size: 13.5px; color: #6b7280; line-height: 1.6;
            padding-left: 19px; position: relative; margin-bottom: 13px;
        }
        .bullet:last-child { margin-bottom: 0; }
        .bullet:before {
            content: ""; position: absolute; left: 0; top: 8px;
            width: 7px; height: 7px; border-radius: 50%; background: #bbf7d0;
        }
        .half.no .bullet:before { background: #fecdd3; }
        .bullet strong { color: #111827; font-weight: 700; }

        .next-row {
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 12px;
            padding: 16px 24px; margin-bottom: 16px;
        }
        .next-hint { font-size: 13px; color: #4b5563; line-height: 1.6; }
        .btn {
            padding: 13px 22px; border-radius: 9px; font-size: 13.5px; font-weight: 600;
            border: none; cursor: pointer; font-family: inherit;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-primary { background: #7c3aed; color: #ffffff; flex-shrink: 0; }
        .btn-primary:hover { background: #6d28d9; transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: #7c3aed; border: 1px solid #ddd6fe; }
        .btn-secondary:hover { background: #f3f0ff; }
        .back-row { display: flex; gap: 12px; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="overlay">
        <div class="spinner-lg"></div>
        <div class="loading-msg">Reading the transcripts of your past appearances...</div>
        <div class="loading-sub">Matching on who is actually in the room</div>
    </div>

    <div class="header">
        <div class="header-left">
            <div class="header-dot"></div>
            <div class="header-logo">Audience Message Research</div>
        </div>
        <div class="header-back" onclick="window.location.href='l2.html'">&larr; The room</div>
    </div>

    <div class="container">

        <div class="page-title">Compared to your past appearances</div>
        <div class="page-sub" id="pageSub"></div>

        <!-- The framing line, in the slot the four stat tiles used to fill.
             NO NUMBER GOES BACK IN HERE. -->
        <div class="framing">
            <div class="framing-label" id="framingLabel"></div>
            <div class="framing-line" id="framingLine"></div>
        </div>

        <div class="halves">
            <div class="half no">
                <div class="half-title">&#9888; This audience does not respond to</div>
                <div id="notRespondList"></div>
            </div>
            <div class="half">
                <div class="half-title">&#10003; This audience typically responds to</div>
                <div id="respondList"></div>
            </div>
        </div>

        <div class="next-row">
            <div class="next-hint">The last step turns that into the actual 45 minutes.</div>
            <button class="btn btn-primary" onclick="window.location.href='l4.html'">Build the running order &nbsp;&rarr;</button>
        </div>

        <div class="back-row">
            <button class="btn btn-secondary" onclick="window.location.href='l2.html'">&larr; Back to the room</button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">Start new research</button>
        </div>

    </div>

    <script>
        var P = PROVISIONAL;

        document.getElementById('pageSub').textContent = P.name + ' - ' + P.roomDescriptor + '.';
        document.getElementById('framingLabel').textContent = P.framingLabel;
        document.getElementById('framingLine').textContent  = P.framingLine;

        function bullets(list) {
            return list.map(function (b) {
                return '<div class="bullet"><strong>' + b.lead + '</strong> - ' + b.tail + '</div>';
            }).join('');
        }
        document.getElementById('notRespondList').innerHTML = bullets(P.notRespond);
        document.getElementById('respondList').innerHTML    = bullets(P.respond);

        setTimeout(function () {
            document.getElementById('overlay').classList.add('hidden');
        }, 1500);
    </script>
</body>
</html>
