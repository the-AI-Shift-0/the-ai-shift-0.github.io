<html lang="en">

<!--
  ═══════════════════════════════════════════════════════════════════
  RECORDING NOTE - NOTHING AUTO-ADVANCES. DO NOT REINSTATE A TIMER.
  Owner's decision, 2026-08-12: this page is filmed live and the whole
  sequence is driven by the presenter's own click. On load the page
  sits still with an empty, focused link field and NOTHING happens.
  He pastes the podcast link, clicks "Start Research" (or presses
  Enter), and only THEN does the loading state run and the page move
  to l2.html. There is no setTimeout anywhere that navigates or that
  reveals the overlay on its own. If the field is empty the button
  nudges the field instead of advancing, so a mis-timed click cannot
  jump the sequence forward.
  ═══════════════════════════════════════════════════════════════════
  RECORDING NOTE - THE RESEARCH RUN TAKES ~16 SECONDS, DELIBERATELY.
  Owner's decision, 2026-08-19: "it'll have to be edited so that this
  research time takes longer than like a second." It used to resolve in
  2.9 seconds, which read as an animation rather than as work. It now runs
  16.0s end to end (measured, both 1400x1000 and 1280x800), one step at a
  time, with a pulsing dot on the live step, what that step is doing on
  the right, a tick when it clears, and an elapsed clock underneath. The
  step durations are intentionally UNEVEN - an even cadence is what made
  the old one read as fake. Talk over it; do not cut it back down. All the
  timing lives in STEPS[] in the script at the foot of this file.
  ═══════════════════════════════════════════════════════════════════
  RECORDING NOTE - NOTHING IS BLURRED. DO NOT REINSTATE THE BLUR.
  The show name, the host name and the show URL render SHARP on every
  page. Owner's decision, 2026-08-11: "Just take a real podcast, do not
  blur out the name and look at actual data and all of that about it."
  On camera Sai says he is IN TALKS with them about appearing. No page
  anywhere claims he is booked, and that framing is what keeps naming a
  real third party honest. An earlier build blurred the two names; that
  build is superseded and the pii-blur class has been deleted outright.
  ═══════════════════════════════════════════════════════════════════
  Message to Audience - "Audience Message Research" (Demo 1)
  Built HTML shown in the video as if it were the real running system.
  Show swapped 2026-08-11 to The Amy Porterfield Show, per
  docs/research/2026-08-11-message-to-audience-real-podcast-v4.md.
  Renamed from "Research Engine" 2026-08-12, owner's wording.

  Pages: index.html (this) -> l2.html -> l3.html -> l4.html (the running
  order - the beat an earlier build wrongly deleted).

  THE LINK THE PRESENTER PASTES ON CAMERA (do not prefill it - he types
  or pastes it himself, live):
    https://podcasts.apple.com/us/podcast/the-amy-porterfield-show/id594703545

  WHAT IS REAL (every figure fetched from a primary source 2026-08-11)
    The Amy Porterfield Show, hosted by Amy Porterfield.
    4.9 stars from 4,575 Ratings (Apple ratings block) · 885 episodes
    (Apple "Information") · running since 2013 · updated weekly ·
    Marketing category · YouTube @AmyPorterfield 41,900 subscribers.
    https://podcasts.apple.com/us/podcast/the-amy-porterfield-show/id594703545
    EVERY ONE OF THOSE FIGURES IS A LINK ON l2.html, straight to the
    Apple show page or the YouTube channel it was read from, so anyone
    watching can check it (owner's requirement, 2026-08-12).
    The audience description on l2 is from the show's OWN description.
    NO episode title appears anywhere in this build.
    Audience size: downloads and listener numbers are NOT publicly
    stated anywhere, so no such figure appears and none is estimated.
    Reading volume shown on l2 is also real: 1,219 written reviews
    retrieved, and 123 comments harvested across 24 videos. Those two
    are counts of THIS TOOL'S OWN READING, not published podcast
    figures, so they sit in their own labelled group and carry no
    external source link - there is no external page to point at.
    Every quote on every page is VERBATIM from a real public Apple
    Podcasts review or a real public YouTube comment, each independently
    re-confirmed on a second fetch. The words are unaltered.

  NO REVIEWER HANDLE RENDERS ON ANY PAGE (owner's decision, 2026-08-11)
    Not blurred - absent. A handle is personal data we have no reason to
    carry, and the script's claim is about what the AUDIENCE says in
    general, not about who individually said it. Blurring one would
    signal that a person is being hidden, which draws the eye rather
    than away. Each quote carries a neutral source label only - "Apple
    Podcasts review" or "YouTube comment". The real handle is recorded
    in an INTERNAL ONLY comment beside each quote so a quote can still
    be re-verified later; a JS comment can never reach the page.
    QUOTE SELECTION TEST, applied to every quote on every page: if the
    verbatim text contains the show name, the host's name, or any third
    party's name, the quote is DROPPED and another confirmed one is used.
    A quote is never edited to sanitise it - that would break the
    "verbatim, not paraphrased" promise this build exists to keep.
    Dropped under this test 2026-08-11 (both name the host inside the
    verbatim text): "I am just starting and Amy is giving me such
    encouragement in easy to take bites..." and "Whenever I get stuck
    along the way ... in the wealth of information Amy has accumulated
    in these podcast archives." Three further confirmed items were
    skipped because their full bodies name a third party or a named
    business. Replacements came from the same confirmed pool.

  WHAT IS SIMULATED (this is a built demo of an internal tool)
    Sai's appearance library, every cross-reference count, the six
    analysis conclusions, and the whole running order on l4.html.

  NUMBER MODEL - no subset ever exceeds its base:
    REAL, and each is its own base:
      Written reviews read ........................ 1,219
      Comments read ............................... 123, across 24 videos
      Discarded before reading (subset of 123) .... 38 host replies
                                                  + 1 guest reply
                                                  + 14 from one repeat
                                                    commenter = 53 of 123
      Apple ratings ............................... 4,575 · 885 episodes
      YouTube subscribers ......................... 41,900
    SIMULATED:
      Appearance library (base) ................... 41 past appearances
      Comparable rooms matched (subset of 41) ..... 9
      Hooks tested against those 9 rooms .......... 7
        Landed ..................................... 5  ┐
        Died ....................................... 2  ┘  5 + 2 = 7
      Per-hook usage (each a subset of the 9 comparable rooms):
        "I was terrible at this for years" ......... used 6 of 9 · landed 6 of 6
        "Seven hours down to forty-five minutes" ... used 5 of 9 · landed 5 of 5
        "The catch-22 I built myself" .............. used 4 of 9 · landed 4 of 4
        (+2 more landed hooks, not itemised on screen)
        "Open with the fifteen million" ............ used 3 of 9 · died 3 of 3  [WOW]
        "Lead with the AI, not the hours" .......... used 2 of 9 · died 2 of 2
      Every usage count (6,5,4,3,2) is at or below the 9-room base.
      Landed uses 6+5+4 across 9 rooms is fine - a room hears several
      hooks in one appearance.
      Running order on l4: 5 + 17 + 12 + 11 = 45 minutes exactly.

  NO revenue, margin or team-size bar on any page: researching someone
  else's audience never uses the viewer's own figures.
  NO NARRATION ON SCREEN (owner's decision, 2026-08-12). The "seven
  hours by hand" line and the "anything can summarise a show" line were
  deleted outright - the presenter says both out loud on camera, and a
  page that says them too makes him read his own slides.
  No jargon on screen: the six things are always named in plain English,
  and the last screen is always "the running order" / "the 45 minutes".
  ═══════════════════════════════════════════════════════════════════
-->
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Message Research</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f7ff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* The overlay starts hidden and is only ever revealed by start().
           Nothing on this page reveals it on a timer. */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #f8f7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .loading-overlay.showing { opacity: 1; pointer-events: auto; }
        .spinner-lg {
            width: 30px; height: 30px;
            border: 3px solid #e9d5ff;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg { font-size: 15px; color: #4b5563; font-weight: 600; }
        .loading-steps {
            display: flex; flex-direction: column; gap: 13px;
            width: 460px;
        }
        .loading-step {
            display: flex; align-items: center; gap: 13px;
            font-size: 13px; color: #9ca3af;
            transition: color 0.3s;
        }
        .loading-step.active { color: #111827; font-weight: 600; }
        .loading-step.done { color: #4b5563; }
        .step-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #e9d5ff; flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .step-dot.active {
            background: #7c3aed;
            box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5);
            animation: pulse 1.4s ease-out infinite;
        }
        @keyframes pulse {
            70%  { box-shadow: 0 0 0 7px rgba(124, 58, 237, 0); }
            100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }
        .step-dot.done { background: #7c3aed; animation: none; box-shadow: none; }
        .step-label { flex: 1; min-width: 0; }
        /* Right-hand column: what it is doing right now, then a tick. Fixed
           width so the labels never shift sideways as the run progresses. */
        .step-side {
            width: 178px; flex-shrink: 0; text-align: right;
            font-size: 11px; font-weight: 500; color: #9ca3af;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .step-side.tick { color: #7c3aed; font-weight: 700; }
        .loading-elapsed {
            font-size: 11.5px; color: #b6b2c4; letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 1px solid #ddd6fe;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-dot { width: 10px; height: 10px; border-radius: 50%; background: #7c3aed; }
        .header-logo { font-weight: 700; font-size: 16px; color: #111827; letter-spacing: -0.3px; }
        .header-right { display: flex; gap: 16px; align-items: center; }
        .status-badge { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #6b7280; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }

        .container {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 72px 40px;
        }
        .content { max-width: 720px; width: 100%; }

        .eyebrow {
            font-size: 12px; font-weight: 700; color: #7c3aed;
            text-transform: uppercase; letter-spacing: 0.1em;
            margin-bottom: 22px;
        }
        .prompt-title {
            font-size: 30px; font-weight: 700; color: #111827;
            line-height: 1.35; letter-spacing: -0.6px;
            margin-bottom: 52px;
        }

        .field-label {
            display: block;
            font-size: 13px; font-weight: 700; color: #374151;
            letter-spacing: 0.01em;
            margin-bottom: 12px;
        }
        .url-input {
            display: block; width: 100%;
            background: #ffffff;
            border: 1.5px solid #ddd6fe;
            border-radius: 12px;
            padding: 20px 22px;
            font-size: 16px; font-family: inherit; color: #111827;
            line-height: 1.4;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .url-input::placeholder { color: #b6b2c4; }
        .url-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }
        .url-input.nudge {
            border-color: #f97316;
            animation: nudge 0.42s ease;
        }
        @keyframes nudge {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            45% { transform: translateX(5px); }
            70% { transform: translateX(-3px); }
        }
        .field-note {
            font-size: 13px; color: #9ca3af;
            margin-top: 12px; line-height: 1.6;
            min-height: 21px;
        }
        .field-note.warn { color: #c2410c; }

        .run-btn {
            margin-top: 40px;
            background: #7c3aed; color: #ffffff;
            border: none; border-radius: 11px;
            padding: 18px 32px; font-size: 16px; font-weight: 600;
            font-family: inherit; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
            transition: background 0.15s, transform 0.1s;
        }
        .run-btn:hover { background: #6d28d9; transform: translateY(-1px); }
        .run-btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="loading-overlay" id="overlay">
        <div class="spinner-lg"></div>
        <div class="loading-msg">Reading the room...</div>
        <div class="loading-steps" id="loadingSteps"></div>
        <div class="loading-elapsed" id="elapsed">0:00 elapsed</div>
    </div>

    <div class="header">
        <div class="header-left">
            <div class="header-dot"></div>
            <div class="header-logo">Audience Message Research</div>
        </div>
        <div class="header-right">
            <div class="status-badge"><div class="status-dot"></div><span>Appearance library loaded</span></div>
        </div>
    </div>

    <div class="container">
        <div class="content">

            <div class="eyebrow">New research</div>
            <h1 class="prompt-title">Enter the link of the podcast you want to research.</h1>

            <label class="field-label" for="urlInput">Podcast link</label>
            <input class="url-input" id="urlInput" type="url" autocomplete="off"
                   spellcheck="false" placeholder="Paste the podcast link here">
            <div class="field-note" id="fieldNote">Paste the link to the show, then start the research.</div>

            <button class="run-btn" id="startBtn" type="button">Start Research &nbsp;&rarr;</button>

        </div>
    </div>

    <script>
        /* NOTHING RUNS ON LOAD except focusing the field. The presenter
           drives the whole sequence - see the recording note above. */
        var input   = document.getElementById('urlInput');
        var note    = document.getElementById('fieldNote');
        var overlay = document.getElementById('overlay');
        var started = false;

        input.focus();

        input.addEventListener('input', function () {
            input.classList.remove('nudge');
            note.classList.remove('warn');
            note.textContent = 'Paste the link to the show, then start the research.';
        });

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); start(); }
        });

        document.getElementById('startBtn').addEventListener('click', start);

        function start() {
            if (started) { return; }

            if (!input.value.trim()) {
                /* Empty field never advances. It nudges, so a stray click
                   on camera cannot jump the sequence forward. */
                input.classList.remove('nudge');
                void input.offsetWidth;
                input.classList.add('nudge');
                note.classList.add('warn');
                note.textContent = 'Add a podcast link to start.';
                input.focus();
                return;
            }

            started = true;
            overlay.classList.add('showing');
            runResearch();
        }

        /* ══════════════════════════════════════════════════════════════
           THE RESEARCH RUN TAKES ~15 SECONDS, ON PURPOSE.
           Owner's decision, 2026-08-19: the old run resolved in 2.9s, which
           reads as a canned animation rather than work. It now runs long
           enough to be believable, and it shows what it is doing while it
           runs - a pulsing dot on the live step, the detail of that step on
           the right, a tick when it clears, and an elapsed clock. The step
           durations are deliberately UNEVEN; an even cadence is the thing
           that made it read as fake. Every count named on the right is a
           real figure and matches l2.html exactly.
           To shorten or lengthen the whole run, scale STEPS[].ms - nothing
           else depends on the total.
           ══════════════════════════════════════════════════════════════ */
        var STEPS = [
            { label: 'Where they came from',            detail: 'Reading 1,219 reviews',     ms: 1900 },
            { label: 'The pain under the pain',         detail: 'Reading 123 comments',      ms: 2400 },
            { label: 'What actually drives them',       detail: 'Discarding 53 of those',    ms: 1600 },
            { label: 'What they are afraid of',         detail: 'Grouping what repeats',     ms: 2700 },
            { label: 'What stories land',               detail: 'Ranking by how often',      ms: 2100 },
            { label: 'What winning looks like to them', detail: 'Checking each against a quote', ms: 1800 },
            { label: 'Pulling the words they use themselves', detail: 'Lifting them unedited', ms: 2600 }
        ];

        function runResearch() {
            var wrap = document.getElementById('loadingSteps');
            wrap.innerHTML = STEPS.map(function (st, i) {
                return '<div class="loading-step" id="r' + i + '">' +
                       '<div class="step-dot" id="s' + i + '"></div>' +
                       '<span class="step-label">' + st.label + '</span>' +
                       '<span class="step-side" id="d' + i + '"></span></div>';
            }).join('');

            var t0 = Date.now();
            var clock = setInterval(function () {
                var sec = Math.floor((Date.now() - t0) / 1000);
                document.getElementById('elapsed').textContent =
                    Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2) + ' elapsed';
            }, 250);

            var at = 0;
            STEPS.forEach(function (st, i) {
                setTimeout(function () {
                    document.getElementById('r' + i).classList.add('active');
                    document.getElementById('s' + i).classList.add('active');
                    document.getElementById('d' + i).textContent = st.detail;
                }, at);
                at += st.ms;
                setTimeout(function () {
                    var row = document.getElementById('r' + i);
                    row.classList.remove('active');
                    row.classList.add('done');
                    var dot = document.getElementById('s' + i);
                    dot.classList.remove('active');
                    dot.classList.add('done');
                    var side = document.getElementById('d' + i);
                    side.classList.add('tick');
                    side.innerHTML = '&#10003;';
                }, at);
            });

            setTimeout(function () {
                clearInterval(clock);
                window.location.href = 'l2.html';
            }, at + 900);
        }
    </script>
</body>
</html>
