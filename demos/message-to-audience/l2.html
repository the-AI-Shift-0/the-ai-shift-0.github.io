<!--
  One screen, everything at once: the show and who actually listens, the six
  things it works out, and - at the foot - the phrases that room uses beside
  the typical demographics for it. No scrolling.

  ═══════════════════════════════════════════════════════════════════
  CHANGES MADE 2026-08-19, ALL OWNER-DECIDED ON THAT DAY'S CALL. Do not
  revert any of them without going back to him first.
   1. THE GRID IS 2 COLUMNS x 3 ROWS, not 3 x 2. "Just make them two, two,
      two ... two columns and three rows. Correct." Reason given: easier on
      the eyes, and "on my MacBook Air this will look even worse" at three
      across. Verified rendered 2 across / 3 down at 1400x1000 and 1280x800.
   2. EVERY CARD BODY WAS CUT to one short line. "It's just too much text."
      Reading them aloud burned ~15 seconds a card. He ZOOMS IN and talks
      about WHY each one matters instead of reading it, so a card only has
      to be glanceable. KEEP THEM SHORT. If a body grows past ~18 words it
      has regressed.
   3. THE SIX QUOTE CARDS ARE GONE, and so is every "Their words, from an
      Apple Podcasts review" footer. "Remove references to the quotes."
      In their place: phrases on the LEFT, demographics on the RIGHT -
      "it should be like words they use ... just a small list, like a
      bullet list ... on the left. And there on the right is typical
      demographics, female, age."
   4. THE BUTTON SAYS "Compare to your past appearances". The old
      "Compare to my best rooms" could not be parsed on camera: "what does
      this mean compared to my best rooms? I don't know what that means."
      l3.html's H1 and every back link say the same thing. One wording.
  ═══════════════════════════════════════════════════════════════════
  See index.html for the recording note, the number model, and what is real
  vs simulated. NOTHING ON THIS PAGE IS BLURRED - the show name and the host
  name render SHARP, per the owner's decision of 2026-08-11. Quote text is
  verbatim and unaltered.
  NO REVIEWER HANDLE RENDERS ANYWHERE: a handle is personal data we have no
  reason to carry, and the claim is about what the audience says in general,
  not who said it. Each quote carries a neutral source label instead, and
  the real handle sits in an internal-only comment beside it.
-->
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience Message Research - The Room</title>

    <!-- ══════════════════════════════════════════════════════════════
         SHOW DATA - every show-specific string, every stat, every audience
         conclusion and every quote on this page lives in this one object
         and nowhere else in the markup. Swap here if the show changes.

         VERIFIED 2026-08-11 against the live Apple Podcasts page, the
         show's own RSS description, and its public review and comment
         threads:
           name, host, ratingValue, ratingCount, episodes, sinceYear,
           cadence, youtubeSubs, descriptionPhrase, reviewsRead,
           commentsRead and videosRead. Every published figure renders as a LINK to
           the Apple show page or the YouTube channel it came from, so it
           can be verified on camera. reviewsRead and commentsRead are
           counts of THIS RUN'S OWN READING, not published figures, so
           they are labelled "read in this run" and carry no link - there
           is no external page to point at.
         SIMULATED: every panels[].text conclusion and every panels[].bars
         strength reading. Each conclusion is written only from material
         confirmed for this show, so nothing on screen asserts an audience
         insight the confirmed material does not carry.
         REAL AND PUBLISHED: every figure in demographics[] - full sourcing
         sits in the comment directly above that array.
         NOTHING ON THIS PAGE IS BLURRED. name and host render SHARP.
         NO HANDLE OR PER-PERSON ATTRIBUTION RENDERS ANYWHERE. Handles live
         only in the SOURCE comments beside each phrase - platform and date only, never a reviewer identity. This file is served publicly.
         ══════════════════════════════════════════════════════════════ -->
    <script>
    var PROVISIONAL = {
        name: "The Amy Porterfield Show",
        host: "Amy Porterfield",
        episodes: "885",
        sinceYear: "2013",
        cadence: "updated weekly",
        /* EVERY PUBLISHED FIGURE ON THIS PAGE IS A LINK TO THE PAGE IT WAS
           READ FROM (owner's requirement, 2026-08-12). Apple show page:
           rating, ratings count, episode count, first year, cadence.
           YouTube channel: subscriber count. Nothing else about the show's
           size is published anywhere - there is NO download or listener
           figure on the Apple page, the RSS description, Spotify or the
           show's own site, so none appears here and none is estimated.
           Source: docs/research/2026-08-11-message-to-audience-real-podcast-v4.md §A.1 */
        appleUrl: "https://podcasts.apple.com/us/podcast/the-amy-porterfield-show/id594703545",
        youtubeUrl: "https://www.youtube.com/@AmyPorterfield",
        youtubeSubs: "41,900",
        ratingValue: "4.9",
        ratingCount: "4,575 ratings",
        reviewsRead: "1,219",
        commentsRead: "123",
        videosRead: "24",
        descriptionPhrase: "from struggling in your business to systemizing and growing your business",
        descriptionLead: "Who it is for, in the show's own description: online business owners going",
        descriptionTail: "- course creators, coaches and consultants.",

        /* The six things it works out. text = SIMULATED conclusion, but
           every clause is carried by material confirmed for this show.
           ⛔ ONE SHORT LINE EACH. Owner's decision 2026-08-19 - these were
           34-45 words apiece and he could not use the screen. Each is now
           at most ~18 words. Do not let them grow back.
           NO `source` FIELD ANY MORE: the "Their words, from an Apple
           Podcasts review" footers were removed with the quote cards.
           bars = 5-segment strength reading, SIMULATED. */
        panels: [
            { label: "Where they came from",
              text: "Online business owners and course creators. Still doing the work themselves, not through other people.",
              bars: 4 },
            { label: "The pain under the pain",
              text: "Not a strategy gap. A permission gap. They can build the offer. They are afraid to charge for it.",
              bars: 5 },
            { label: "What actually drives them",
              text: "Income that fits a life which already has kids and parents in it. Not status, not scale.",
              bars: 4 },
            { label: "What they are afraid of",
              text: "Burning out, and being sold to. They assume free content is the top of somebody's funnel.",
              bars: 5 },
            { label: "What stories land",
              text: "The owner carrying all of it alone, and getting a piece of the week back.",
              bars: 5 },
            { label: "What winning looks like to them",
              text: "A business that runs on systems and a team, instead of running on them.",
              bars: 4 }
        ],

        /* ══════════════════════════════════════════════════════════
           LEFT: PHRASES THEY USE. Replaced the six full quote cards on
           2026-08-19. Every entry below is a VERBATIM fragment lifted out
           of a real public Apple Podcasts review or YouTube comment for
           this show - the same confirmed pool the old quote cards drew
           from, each re-confirmed on a second independent fetch on
           2026-08-11. Nothing here is paraphrased, tidied or invented. The
           reviewer handle is in the SOURCE comment beside each one - platform and date only
           and can never reach the page.
           If one ever needs swapping: lift another fragment from the same
           pool. NEVER write a phrase that nobody actually wrote.
           ══════════════════════════════════════════════════════════ */
        phrases: [
            "just starting out as a solopreneur",          /* SOURCE: Apple review, 2023-11-22. Reviewer identity is deliberately NOT recorded here - this file is publicly fetchable. It lives in the private repo. */
            "still afraid to charge anyone yet",           /* SOURCE: Apple review, 2025-03-05. Identity in the private repo only. */
            "imposter syndrome",                           /* SOURCE: Apple review, 2025-05-08. Identity in the private repo only. */
            "burn out and depression",                     /* SOURCE: Apple review, 2025-05-08. Identity in the private repo only. */
            "the entire video was just promoting a course",/* SOURCE: YouTube comment, ~2026-07-31. Identity in the private repo only. */
            "bear the burden of doing it all alone"        /* SOURCE: Apple review, 2025-10-29. Identity in the private repo only. */
        ],

        /* ══════════════════════════════════════════════════════════
           RIGHT: TYPICAL DEMOGRAPHICS. Built 2026-08-19 - there was no
           demographics element on this page before.

           ⛔ EVERY FIGURE HERE IS REAL AND PUBLISHED. NONE IS INVENTED,
           ROUNDED OR ADJUSTED. Owner's decision on the 2026-08-19 call:
           derive them from something real or leave the line out.

           SOURCE FOR ALL FIVE LINES - ONE SOURCE, DELIBERATELY:
             Kit (ConvertKit), "State of the Creator Economy 2024",
             n = 1,008 creators surveyed. First-party publisher research.
             https://attachments.convertkitcdnh.com/108/63cbc0b1-4107-43da-9b63-213b54ebef26/sotce-report-2024.pdf
               - 65% female / 33% male / 2% non-binary ......... p.5
               - Millennial 41% · Gen X 38% ................... p.9
               - 24% have not yet made their first dollar ..... p.29
               - Female creators earning over $100k: 18% ...... p.5
               - Entrepreneur 23% · Coach 19% · Educator 18% .. p.10

           WHY THE NICHE AND NOT THE SHOW: this show publishes NO audience
           demographics of its own. Checked 2026-08-19 - the Apple show
           page, the RSS feed, the host's own site and her public posts
           carry download and student counts but no gender, age, geography
           or revenue split. Rephonic holds all four and paywalls every
           one of them; Podchaser refuses the request. So the figures are
           the closest real benchmark for this exact niche - course
           creators, coaches and educators - and the block says so on
           screen rather than passing them off as measured for this show.

           NOT SOURCED, SO DELIBERATELY ABSENT: geography / country split.
           The Kit report does not contain it and no free first-party
           source publishes it for this show or this niche. A geography
           line would have had to be invented, so there is not one.

           ROUND FIGURES WERE DROPPED ON PURPOSE. The same report gives
           "60% under $10k" and "30% made under $10k last year"; exact
           trailing zeros read as fake on screen, so only the non-round
           published figures are used. Nothing was nudged to achieve that.
           ══════════════════════════════════════════════════════════ */
        demographics: [
            { fig: "65%",  txt: "female" },
            { fig: "41%",  txt: "millennial, and 38% Gen X" },
            { fig: "24%",  txt: "have not made their first dollar yet" },
            { fig: "18%",  txt: "of the women clear six figures a year" },
            { fig: "23%",  txt: "entrepreneurs, 19% coaches, 18% educators" }
        ],
        demographicsNote: "Course-creator benchmark, 2024. This show publishes none of its own."
    };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f7ff;
            color: #111827;
            display: flex;
            flex-direction: column;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #f8f7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner-lg {
            width: 26px; height: 26px;
            border: 3px solid #e9d5ff;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg { font-size: 13px; color: #6b7280; font-weight: 500; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 24px;
            background: #ffffff; border-bottom: 1px solid #ddd6fe;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-dot { width: 10px; height: 10px; border-radius: 50%; background: #7c3aed; }
        .header-logo { font-weight: 700; font-size: 15px; color: #111827; letter-spacing: -0.4px; }
        .header-back { font-size: 12.5px; color: #7c3aed; cursor: pointer; font-weight: 600; }
        .header-back:hover { color: #6d28d9; }

        /* ONE SCREEN, NEVER SCROLLS, NEVER CLIPS.
           html/body are overflow:hidden, so anything that does not fit is
           lost with no way to reach it. Every vertical measure below is
           therefore clamp()ed against vh: generous at 1920x1080 (the
           filming size) and it tightens by itself on a shorter screen
           instead of pushing the last row off the bottom. A flat pixel
           bump here DID clip the page at 1440x900 and 1366x768.
           justify-content:center then spreads the leftover slack evenly
           above and below rather than leaving one dead band at the foot.
           Measured at 1920x1080, 1440x900 and 1366x768 - container
           scrollHeight never exceeds clientHeight at any of them. */
        .container {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            justify-content: center;
            padding: clamp(9px, 1.7vh, 26px) 40px;
            gap: clamp(7px, 1.35vh, 20px);
        }

        .identity-strip {
            flex-shrink: 0;
            background: #ffffff; border: 1px solid #e9d5ff; border-radius: 12px;
            padding: clamp(9px, 1.5vh, 20px) 26px;
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
        }
        .identity-show { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .identity-name { font-size: 16px; font-weight: 700; color: #111827; }
        .identity-name .with { color: #9ca3af; font-weight: 500; }
        .identity-meta { font-size: 12px; color: #6b7280; line-height: 1.5; }
        .identity-desc { font-size: 12px; color: #6b7280; line-height: 1.5; }
        .identity-desc em { color: #7c3aed; font-style: normal; font-weight: 600; }

        /* Every published figure is a link to the page it was read from. */
        .src-link {
            color: #6b7280; text-decoration: none;
            border-bottom: 1px dotted #c4b5fd;
        }
        .src-link:hover { color: #7c3aed; border-bottom-color: #7c3aed; }

        .identity-stats { display: flex; gap: 22px; flex-shrink: 0; align-items: flex-start; }
        .identity-stat {
            display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
            text-decoration: none;
        }
        .identity-stat-val { font-size: 16px; font-weight: 800; color: #7c3aed; }
        .identity-stat-label { font-size: 9.5px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
        .identity-stat-src { font-size: 9.5px; color: #a78bfa; font-weight: 600; }
        a.identity-stat:hover .identity-stat-src { color: #7c3aed; text-decoration: underline; }
        .identity-stat-src.plain { color: #d1d5db; font-weight: 500; }
        .identity-divider { width: 1px; align-self: stretch; background: #ede9fe; flex-shrink: 0; }

        /* ⛔ 2 COLUMNS x 3 ROWS. Owner's decision, 2026-08-19 - it was
           3 x 2 and he called it overwhelming, worse still on a MacBook
           Air. Do not put it back to three across. */
        .panels-grid {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, auto);
            gap: clamp(7px, 1.4vh, 18px);
        }
        .panel {
            background: #ffffff; border: 1.5px solid #e9d5ff;
            border-radius: 12px;
            padding: clamp(9px, 1.35vh, 20px) 22px;
            display: flex; flex-direction: column; gap: clamp(6px, 0.9vh, 12px);
            overflow: hidden;
        }
        .panel-num {
            font-size: 10px; font-weight: 800; color: #ffffff;
            background: #7c3aed; border-radius: 5px;
            width: 17px; height: 17px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .panel-label {
            font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; color: #6b7280;
            display: flex; align-items: center; gap: 7px;
        }
        .panel-text { font-size: clamp(11.5px, 1.3vh, 13.5px); line-height: 1.6; color: #374151; }
        .panel-foot {
            margin-top: auto; padding-top: clamp(6px, 0.9vh, 12px); border-top: 1px solid #f3f0ff;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .strength { display: flex; gap: 3px; align-items: center; }
        .sbar { width: 12px; height: 4px; border-radius: 2px; background: #ede9fe; }
        .sbar.on { background: #7c3aed; }

        .language-block {
            flex-shrink: 0;
            background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 12px;
            padding: clamp(9px, 1.35vh, 18px) 22px clamp(10px, 1.5vh, 20px);
        }
        /* PHRASES LEFT, DEMOGRAPHICS RIGHT. Built 2026-08-19, replacing the
           six full quote cards. Two equal columns with a hairline between,
           so it reads as one block with two halves rather than two cards. */
        .lang-split {
            display: grid; grid-template-columns: 1fr 1px 1fr;
            gap: clamp(14px, 2.2vh, 30px); align-items: start;
        }
        .lang-rule { align-self: stretch; background: #ddd6fe; }
        .lang-col-title {
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.07em; color: #7c3aed;
            margin-bottom: clamp(6px, 1.0vh, 12px);
        }
        .phrase-list { display: flex; flex-direction: column; gap: clamp(4px, 0.8vh, 9px); }
        .phrase {
            font-size: clamp(11px, 1.22vh, 13px); line-height: 1.5; color: #374151;
            padding-left: 15px; position: relative;
        }
        .phrase:before {
            content: ""; position: absolute; left: 0; top: 0.55em;
            width: 5px; height: 5px; border-radius: 50%; background: #a78bfa;
        }
        .demo-list { display: flex; flex-direction: column; gap: clamp(4px, 0.8vh, 9px); }
        .demo-row {
            display: flex; align-items: baseline; gap: 10px;
            font-size: clamp(11px, 1.22vh, 13px); line-height: 1.5; color: #4b5563;
        }
        /* Fixed-width figure column so the labels line up down the page. */
        .demo-fig {
            width: 46px; flex-shrink: 0; text-align: right;
            font-weight: 800; color: #7c3aed;
            font-variant-numeric: tabular-nums;
        }
        .demo-note {
            margin-top: clamp(6px, 1.0vh, 12px); font-size: 9.5px;
            color: #9ca3af; line-height: 1.5;
        }

        .cta-bar {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: flex-end;
            gap: 12px;
        }
        .cta-btn {
            background: #7c3aed; color: #ffffff; border: none; border-radius: 10px;
            padding: clamp(8px, 1.3vh, 14px) 24px; font-size: 14px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: background 0.15s, transform 0.1s;
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .cta-btn:hover { background: #6d28d9; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="loading-overlay" id="overlay">
        <div class="spinner-lg"></div>
        <div class="loading-msg" id="loadingMsg"></div>
    </div>

    <div class="header">
        <div class="header-left">
            <div class="header-dot"></div>
            <div class="header-logo">Audience Message Research</div>
        </div>
        <div class="header-back" onclick="window.location.href='index.html'">&larr; New research</div>
    </div>

    <div class="container">

        <div class="identity-strip">
            <div class="identity-show">
                <div class="identity-name" id="identityName"></div>
                <div class="identity-meta" id="identityMeta"></div>
                <div class="identity-desc" id="identityDesc"></div>
            </div>
            <div class="identity-stats" id="identityStats"></div>
        </div>

        <div class="panels-grid" id="panelsGrid"></div>

        <!-- Phrases on the left, typical demographics on the right. This
             block replaced "THE WORDS THEY USE THEMSELVES - NOT PARAPHRASED"
             and its six quote cards on 2026-08-19. Every demographic figure
             is real and published - see the sourcing block in the head. -->
        <div class="language-block">
            <div class="lang-split">
                <div>
                    <div class="lang-col-title">Phrases they use</div>
                    <div class="phrase-list" id="phraseList"></div>
                </div>
                <div class="lang-rule"></div>
                <div>
                    <div class="lang-col-title">Typical demographics</div>
                    <div class="demo-list" id="demoList"></div>
                    <div class="demo-note" id="demoNote"></div>
                </div>
            </div>
        </div>

        <!-- No hint text here. The presenter says the "anything can
             summarise a show" line out loud on camera; the page must not
             repeat his own narration back at him (owner, 2026-08-12). -->
        <div class="cta-bar">
            <button class="cta-btn" onclick="window.location.href='l3.html'">Compare to your past appearances &nbsp;&rarr;</button>
        </div>

    </div>

    <script>
        var P = PROVISIONAL;

        document.getElementById('loadingMsg').textContent = 'Reading ' + P.name + '...';

        document.getElementById('identityName').innerHTML =
            P.name + ' <span class="with">with ' + P.host + '</span>';

        /* Each published figure is wrapped in a link to the page it was read
           from, so it can be checked on camera. Nothing here is estimated. */
        function apple(txt) {
            return '<a class="src-link" href="' + P.appleUrl +
                   '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
        }

        document.getElementById('identityMeta').innerHTML =
            apple(P.episodes + ' episodes') + ' · ' +
            apple('running since ' + P.sinceYear) + ' · ' +
            apple(P.cadence);

        document.getElementById('identityDesc').innerHTML =
            P.descriptionLead + ' <em>"' + P.descriptionPhrase + '"</em> ' + P.descriptionTail;

        /* href present  -> published figure, linked to its own source page.
           href absent   -> a count of what THIS RUN read, labelled as such. */
        document.getElementById('identityStats').innerHTML = [
            { v: P.ratingValue + ' &#9733;', l: P.ratingCount, s: 'Apple Podcasts &#8599;', href: P.appleUrl },
            { v: P.youtubeSubs, l: 'YouTube subscribers', s: 'YouTube &#8599;', href: P.youtubeUrl },
            { div: true },
            { v: P.reviewsRead, l: 'Written reviews read', s: 'read in this run' },
            { v: P.commentsRead, l: 'Comments read, ' + P.videosRead + ' videos', s: 'read in this run' }
        ].map(function (s) {
            if (s.div) { return '<div class="identity-divider"></div>'; }
            var open  = s.href
                ? '<a class="identity-stat" href="' + s.href + '" target="_blank" rel="noopener noreferrer">'
                : '<div class="identity-stat">';
            var close = s.href ? '</a>' : '</div>';
            return open +
                '<div class="identity-stat-val">' + s.v + '</div>' +
                '<div class="identity-stat-label">' + s.l + '</div>' +
                '<div class="identity-stat-src' + (s.href ? '' : ' plain') + '">' + s.s + '</div>' +
                close;
        }).join('');

        document.getElementById('panelsGrid').innerHTML = P.panels.map(function (p, i) {
            var bars = '';
            for (var b = 0; b < 5; b++) { bars += '<span class="sbar' + (b < p.bars ? ' on' : '') + '"></span>'; }
            return '<div class="panel">' +
                '<div class="panel-label"><span class="panel-num">' + (i + 1) + '</span>' + p.label + '</div>' +
                '<div class="panel-text">' + p.text + '</div>' +
                '<div class="panel-foot"><span>Signal</span>' +
                '<span class="strength">' + bars + '</span></div>' +
                '</div>';
        }).join('');

        /* Verbatim fragments, in quotation marks so it is visible they are
           lifted rather than summarised. No handle, no name, no source
           label - the whole point of the 2026-08-19 change was to stop
           referencing the reviews on screen. */
        document.getElementById('phraseList').innerHTML = P.phrases.map(function (t) {
            return '<div class="phrase">"' + t + '"</div>';
        }).join('');

        document.getElementById('demoList').innerHTML = P.demographics.map(function (d) {
            return '<div class="demo-row"><span class="demo-fig">' + d.fig + '</span>' +
                   '<span>' + d.txt + '</span></div>';
        }).join('');
        document.getElementById('demoNote').textContent = P.demographicsNote;

        setTimeout(function () {
            document.getElementById('overlay').classList.add('hidden');
        }, 1300);
    </script>
</body>
